name: Desktop offline distributions
on:
  push:
    branches: [main, release-check]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version after native and redistribution checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.10'}
      - run: python -m pip install ruff
      - run: ruff check --select F,E9 .
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, asset: Linux-amd64}
          - {runner: ubuntu-22.04-arm, asset: Linux-arm64}
          - {runner: macos-15-intel, asset: macOS-x86_64}
          - {runner: macos-15, asset: macOS-arm64}
          - {runner: windows-2022, asset: Windows-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.10'}
      - if: runner.os == 'Linux'
        run: |
          for suite in jammy jammy-updates jammy-security jammy-backports; do
            printf 'deb-src [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu %s main restricted universe multiverse\n' "$suite"
          done | sudo tee /etc/apt/sources.list.d/evoice-sources.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y libportaudio2 libasound2-dev python3-tk xvfb xauth openbox
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -Last 1
          if (-not $compiler) { throw 'Inno Setup compiler is missing from the runner.' }
          python build_release.py --iscc $compiler.FullName
      - if: runner.os != 'Windows'
        run: python build_release.py
      - name: Preserve corresponding Ubuntu sources for the packages just built
        if: runner.os == 'Linux'
        run: python tools/source_companion.py --ubuntu-inventory dist/EVoice/_internal/licenses/system/packages.tsv build/ubuntu-sources
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-sources-${{ matrix.asset }}
          path: build/ubuntu-sources/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - shell: bash
        run: python tools/checksums.py dist
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg -i dist/*.deb
          python tools/check_distribution.py
          sudo unshare --net /opt/e-voice/EVoice --transcribe tests/fixtures/russian-example.wav --output build/qa-offline.json
          xvfb-run -a bash -ec 'openbox >/tmp/evoice-wm.log 2>&1 & python tools/check_install.py /opt/e-voice/EVoice; python tools/check_x11.py'
          export HOME="$RUNNER_TEMP/E Voice user"
          sh installer/install.sh --from dist
          sh installer/install.sh --from dist
          "$HOME/.local/bin/e-voice" --transcribe tests/fixtures/russian-example.wav --output build/archive-speech.json
          python -c "import json; assert 'похвал' in json.load(open('build/archive-speech.json'))['text'].lower()"
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          python tools/check_mac_install.py
          sh installer/install.sh --from dist
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$HOME/Applications/E Voice.app/Contents/MacOS/EVoice" --transcribe tests/fixtures/russian-example.wav --output build/qa-offline.json
          python tools/check_distribution.py
          python tools/check_install.py "$HOME/Applications/E Voice.app/Contents/MacOS/EVoice"
      - name: Install Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python installer/check_windows_wizard.py dist/E-Voice-Setup-x64.exe x64
          if ($LASTEXITCODE) { throw 'Interactive Windows x64 setup check failed' }
          .\installer\install.ps1 -FromDirectory dist -AcceptRuntimeTerms -LogPath "$PWD\build\windows-qa\setup.log"
          python tools/check_distribution.py
      - name: Check installed Windows offline and shutdown lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\E Voice\EVoice.exe"
          New-NetFirewallRule -DisplayName 'E Voice offline CI' -Direction Outbound -Action Block -Program $exe -ErrorAction Stop | Out-Null
          try {
            python installer/check_windows.py $exe
            if ($LASTEXITCODE) { throw "Installed Windows QA failed with exit code $LASTEXITCODE" }
            Copy-Item -LiteralPath 'build/qa-speech.json' -Destination 'build/qa-offline.json'
          } finally {
            Remove-NetFirewallRule -DisplayName 'E Voice offline CI'
          }
      - shell: bash
        run: python -c "import json; assert 'похвал' in json.load(open('build/qa-offline.json',encoding='utf-8'))['text'].lower()"
      - name: Preserve platform QA reports and Windows diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-${{ matrix.asset }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/qa-*.json
            build/windows-qa/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notices-${{ matrix.asset }}
          retention-days: 7
          if-no-files-found: error
          path: build/platform-notices.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-${{ matrix.asset }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.pkg
            dist/*.deb
            dist/*.tar.gz
            dist/E-Voice-Setup-x64.exe
  release:
    needs: [lint, native, windows-arm-compatibility]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.10'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {path: package}
      - name: Validate complete release matrix without overwriting platform evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            [[ "$GITHUB_REF_NAME" == "release/$version" ]]
            main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
            git merge-base --is-ancestor "$main" "$GITHUB_SHA"
            RELEASE_TAG="v$version"
          fi
          python build_release.py --collect-artifacts package --release-directory release --release-tag "$RELEASE_TAG"
      - name: Assemble matching sources and notices from the build artifacts
        run: |
          python tools/source_companion.py package release
          python tools/checksums.py release
      - name: Verify candidate checksums and report package sizes
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS.txt
          stat --format='%n %s' E-Voice-*
      - name: Preserve candidate checksums, sources and QA reports
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-metadata
          retention-days: 7
          if-no-files-found: error
          path: |
            release/SHA256SUMS.txt
            release/*-Licenses-and-Sources.zip
            release/qa-*.json
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            RELEASE_TAG="v$(cat VERSION)"
            existing=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG")
            [[ -z "$existing" ]]
            target=(--target "$GITHUB_SHA")
          else
            target=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" release/* "${target[@]}" --title "E Voice $RELEASE_TAG" --notes-file release-notes.md
  windows-arm-compatibility:
    needs: native
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: packages-Windows-x64, path: package}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.10', architecture: x64}
      - name: Check the interactive installer and Desktop shortcut on Windows ARM
        shell: pwsh
        run: |
          $pywin32 = ((Select-String -Path requirements.lock.txt -Pattern '^pywin32==').Line -split ';')[0]
          python -m pip install $pywin32
          if ($LASTEXITCODE) { throw 'Could not install the Windows QA dependency' }
          python installer/check_windows_wizard.py package/E-Voice-Setup-x64.exe arm64
      - name: Check x64 package under Windows ARM emulation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-qa | Out-Null
          $report = @{ passed = $false }
          try {
            $setupLog = "$PWD\build\windows-qa\setup-arm64.log"
            $setup = Start-Process -PassThru 'package/E-Voice-Setup-x64.exe' -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ACCEPTRUNTIMETERMS=1 /LOG=`"$setupLog`""
            if (-not $setup.WaitForExit(180000)) { Stop-Process -Id $setup.Id -Force; throw 'ARM installer timed out.' }
            if ($setup.ExitCode) { throw "ARM installer exited with code $($setup.ExitCode)" }
            $exe = "$env:LOCALAPPDATA\Programs\E Voice\EVoice.exe"
            $run = Start-Process -PassThru $exe -ArgumentList '--transcribe tests/fixtures/russian-example.wav --output build/qa-arm-speech.json'
            if (-not $run.WaitForExit(200000)) { Stop-Process -Id $run.Id -Force; throw 'ARM speech check timed out.' }
            if ($run.ExitCode -or ((Get-Content -Raw build/qa-arm-speech.json | ConvertFrom-Json).text -notmatch 'похвал')) { throw 'Failed x64 emulation speech check.' }
            $report.passed = $true
          } catch {
            $report.error = $_.ToString()
            throw
          } finally {
            $report | ConvertTo-Json | Set-Content -Encoding utf8 build/qa-arm64.json
          }
      - name: Preserve Windows ARM evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-Windows-arm64
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/qa-*.json
            build/windows-qa/
