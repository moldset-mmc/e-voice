name: Isolated 1.1.3 vs 1.1.4 hang comparison
on:
  push:
    branches: [qa-hang-compare]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-comparison:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout QA harness only (no release changes)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Checkout immutable 1.1.3 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 40df3e8106680175d7eb57875bf9f96390ed4366
          path: comparands/v113
          persist-credentials: false
      - name: Checkout immutable 1.1.4 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ca578a38f82360a053125c5850be7b8a7c36cbb9
          path: comparands/v114
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.10'}
      - name: Install identical dependencies for both source versions
        run: python -m pip install -r requirements.lock.txt
      - name: Record common environment and exact inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $data = @{
            runner = $env:RUNNER_NAME; environment = $env:RUNNER_ENVIRONMENT
            image = $env:ImageOS; imageVersion = $env:ImageVersion
            os = (Get-CimInstance Win32_OperatingSystem).Caption
            python = (python --version); harness = (git rev-parse HEAD)
            v113 = (git -C comparands/v113 rev-parse HEAD)
            v114 = (git -C comparands/v114 rev-parse HEAD)
            utc = [DateTime]::UtcNow.ToString('o')
            limitations = @('Source faults use synthetic recognizer workers and accelerated timeouts', 'Published installers receive unchanged built-in speech and interaction checks; no fault injection into binaries', 'No physical microphone or owner computer tested')
          }
          $data | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 reports/environment.json
          python -m pip freeze | Set-Content -Encoding utf8 reports/dependencies.txt
      - name: Compare source IPC faults (three repeats each)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($version in @('v113', 'v114')) {
            python qa_compare/recognizer_probe.py --source "comparands/$version" --output "reports/$version/ipc"
            if ($LASTEXITCODE) { $failed = $true }
          }
          if ($failed) { throw 'IPC probe infrastructure or checks failed; inspect reports.' }
      - name: Compare real source GUI exit during recognizer hangs
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = $false
          foreach ($version in @('v113', 'v114')) {
            python qa_compare/gui_exit_probe.py --source "comparands/$version" --output "reports/$version/gui-exit.json"
            if ($LASTEXITCODE) { $failed = $true }
          }
          if ($failed) { throw 'GUI exit comparison failed; inspect reports.' }
      - name: Verify and test unchanged published Windows installers
        if: ${{ !cancelled() }}
        shell: pwsh
        # Owner explicitly accepted supplemental Microsoft terms for this isolated comparison, 2026-11-20.
        run: .\qa_compare\installed_probe.ps1 -AcceptRuntimeTerms
      - name: Preserve reports even when a scenario fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-hang-comparison
          retention-days: 30
          if-no-files-found: error
          path: reports/
